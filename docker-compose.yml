# docker-compose.yml — Ambiente completo AIRSOFT AMERICANA
# Versão: desenvolvimento local (não usar em produção)
#
# Serviços:
#   - postgres: PostgreSQL 16 com volume persistente
#   - api: Fastify API (porta 4000)
#   - store: Next.js Storefront (porta 3000)
#   - admin: Next.js Admin (porta 3001)
#
# Uso:
#   docker compose up -d --build        # Sobe tudo (build + migrações)
#   docker compose logs -f              # Logs em tempo real
#   docker compose down                 # Para tudo
#   docker compose down -v              # Para + remove volume (reset DB)
#   docker compose exec api tsx src/db/seed.ts  # Seed manual

services:
  postgres:
    image: postgres:16-alpine
    container_name: airsoft-postgres
    environment:
      POSTGRES_DB: airsoft
      POSTGRES_USER: airsoft
      POSTGRES_PASSWORD: airsoft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airsoft -d airsoft"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: airsoft-api
    environment:
      DATABASE_URL: postgres://airsoft:airsoft@postgres:5432/airsoft
      NODE_ENV: development
      JWT_SECRET: dev-secret-change-in-production
      GATEWAY_SECRETS_KEY: dev-gateway-secrets-key
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    working_dir: /app
    command: >
      sh -c "npm run db:migrate && npm run dev"
    restart: unless-stopped

  store:
    build:
      context: ./apps/store
      dockerfile: Dockerfile
    container_name: airsoft-store
    environment:
      API_URL: http://api:4000
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./apps/store:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: airsoft-admin
    environment:
      API_URL: http://api:4000
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: airsoft-network